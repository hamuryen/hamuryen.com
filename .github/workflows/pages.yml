name: Publish site and refresh Medium

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh Medium cards
        id: medium
        continue-on-error: true
        run: python3 scripts/update-blog.py
      - name: Report feed failure
        if: steps.medium.outcome == 'failure'
        run: echo '::warning::Medium feed could not be refreshed. Publishing the saved cards; the next scheduled run will retry.'
      - name: Test feed refresh
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Synchronize publication metadata
        run: python3 scripts/update-seo.py
      - name: Check content
        run: python3 tests/content_audit.py
      - name: Prepare public files
        run: python3 scripts/package-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
